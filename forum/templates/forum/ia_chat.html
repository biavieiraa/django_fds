{% extends "forum/base.html" %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; font-family: sans-serif;">
    <h2>Protótipo de Assistente IA</h2>

    <form method="POST">
        {% csrf_token %}
        <textarea name="prompt" rows="4" style="width: 100%; padding: 10px;" placeholder="Digite sua pergunta...">{{ prompt }}</textarea>
        <br><br>
        <button type="submit" style="padding: 10px 20px;">Enviar para a IA</button>
    </form>

    {% if resposta %}
        <hr style="margin-top: 30px;">
        <h3>Resposta da IA:</h3>
        <div style="background: #f4f4f4; padding: 15px; border-radius: 5px;">
            <p>{{ resposta }}</p>
        </div>
    {% endif %}
</div>
{% endblock %}
