<header class="header">
        <div class="header-container">
            <h1>FDS Grupo 3</h1>
            
            <!-- Links visíveis para todos os visitantes -->
            <nav class="nav">
                <a href="{% url 'index' %}">Início</a>
                <span class="separator">|</span>
                <a href="{% url 'sobre_nos' %}">Fale Conosco</a>
                <span class="separator">|</span>
                <a href="{% url 'sobre_empresa' %}">Sobre a Empresa</a>
                <span class="separator">|</span>

                <!-- Botão de acesso ao Assistente BZU Tech -->
                <a href="{% url 'ia_chat' %}" class="nav-ia-link">Assistente BZU</a>

                <!-- Autenticação (Entrar / Sair) -->
                {% if user.is_authenticated %}
                    <span class="separator">|</span>
                    <form method="post" action="{% url 'logout' %}" class="logout-form">
                        {% csrf_token %}
                        <button type="submit" class="btn-logout">Sair</button>
                    </form>
                {% else %}
                    <span class="separator">|</span>
                    <a href="{% url 'register' %}">Entrar</a>
                {% endif %}

                <!-- Switch Deslizante (Modo Escuro / Claro) -->
                <span class="separator">|</span>
                <button id="theme-toggle" class="theme-switch" type="button" aria-label="Alternar modo escuro" title="Alternar modo escuro">
                    <span class="switch-icon">☀︎</span>
                    <span class="switch-ball"></span>
                    <span class="switch-icon">☾</span>
                </button>
            </nav>
        </div>
    </header>
