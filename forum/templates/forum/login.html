{% extends 'forum/base.html' %}

{% block title %}Login - MyStackOverflow{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="card login-card">
        <h2>Entrar</h2>
        
        {% if form.errors %}
            <p class="error-message">Usuário ou senha incorretos!</p>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Usuário</label>
                <input type="text" name="username" id="id_username" class="form-control" placeholder="Digite seu usuário" required autofocus>
            </div>

            <div class="form-group">
                <label for="id_password">Senha</label>
                <input type="password" name="password" id="id_password" class="form-control" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <p class="switch-link">
            Não tem conta? <a href="{% url 'register' %}">Criar conta</a>
        </p>
    </div>
</div>
{% endblock %}
