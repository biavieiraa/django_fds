{% extends 'forum/base.html' %}

{% block title %}Fórum MyStackOverflow - Criar Pergunta{% endblock %}

{% block content %}
<div class="card">
    <h2>Criar uma nova pergunta</h2>
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="titulo">Título da Pergunta:</label>
            <input type="text" id="titulo" name="titulo" class="form-control" placeholder="Ex: Como funciona o comando migrate no Django?" required>
        </div>

        <div class="form-group">
            <label for="descricao">Descrição detalhada:</label>
            <textarea id="descricao" name="descricao" class="form-control" placeholder="Descreva sua dúvida com detalhes..." required></textarea>
        </div>

        <button type="submit" class="btn-primary">Publicar Pergunta</button>
    </form>
</div>
{% endblock %}
